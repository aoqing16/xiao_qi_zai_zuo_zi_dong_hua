<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>个人产品作品集</title>
    <link rel="stylesheet" href="style.css"/>
    <!-- 引入 代码高亮 Prism.js 样式 (Dark主题) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"/>
</head>
<body>
<div class="layout-container">

    <!-- 左栏：个人信息区 -->
    <aside class="sidebar">
        <div class="profile-card">
            <img class="avatar" src="zi_yuan_wen_jian_jia/头像图片.png" alt="个人头像"/>
            <h1 class="name">小七在做自动化</h1>
            <p class="bio">
                让机器做重复的事，让人做值得的事
            </p>
        </div>
    </aside>

    <!-- 右栏：产品展示区 -->
    <main class="content">
        <h2 class="section-title">个人产品</h2>

        <div class="product-grid">

            <!-- 产品卡片 1 -->
            <article class="product-card">
                <div class="product-image">
                    <img src="zi_yuan_wen_jian_jia/产品封面.png" alt=""/>
                </div>
                <div class="product-info">
                    <div class="tags">
                        <span class="tag">追剧神器</span>
                        <span class="tag">自动化</span>
                        <span class="tag">极简免配置</span>
                    </div>
                    <h3 class="product-title">自动跳片头追剧小助手</h3>
                    <p class="product-desc">
                        告别手动拉进度条！第一集标记片头时长后，后续剧集自动精准跳过片头。极简零配置，无需频繁碰手机，助你一口气无缝刷完整部剧。
                    </p>
                    <div class="product-actions">
                        <a href="zi_yuan_wen_jian_jia/跳过片头.apk" class="btn btn-primary" target="_blank">📥 下载</a>
                        <button type="button" class="btn btn-secondary" onclick="openTutorialModal()">📖 使用教程
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="openCodeModal()">💻 查看源码</button>
                    </div>
                </div>
            </article>

        </div>
    </main>

</div>

<!-- 源码查看弹窗 -->
<div id="codeModal" class="modal-backdrop" onclick="closeCodeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>跳过op.js - 源码预览</h3>
            <button type="button" class="close-btn" onclick="closeCodeModal(event)">&times;</button>
        </div>
        <div class="modal-body">
            <pre><code id="codeBlock" class="language-javascript">// 正在加载代码...</code></pre>
        </div>
    </div>
</div>

<!-- 使用教程弹窗 -->
<div id="tutorialModal" class="modal-backdrop" onclick="closeTutorialModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>📖 使用教程</h3>
            <button type="button" class="close-btn" onclick="closeTutorialModal(event)">&times;</button>
        </div>
        <div class="modal-body">
            <div id="markdownBody" class="markdown-body">
                正在加载教程...
            </div>
        </div>
    </div>
</div>

<!-- 引入 代码高亮 Prism.js 脚本 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- 引入 Markdown 解析库 Marked.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.min.js"></script>

<script>
    // --- 源码弹窗控制 ---
    function openCodeModal() {
        const modal = document.getElementById('codeModal');
        modal.style.display = 'flex';

        fetch('zi_yuan_wen_jian_jia/跳过op.js')
            .then(response => {
                if (!response.ok) throw new Error('网络响应异常');
                return response.arrayBuffer();
            })
            .then(buffer => {
                const decoder = new TextDecoder('utf-8');
                const codeText = decoder.decode(buffer);
                const codeBlock = document.getElementById('codeBlock');
                codeBlock.textContent = codeText;
                Prism.highlightElement(codeBlock);
            })
            .catch(err => {
                document.getElementById('codeBlock').textContent = '// 读取源码失败，请检查文件路径或确保在 Web 服务（如 Live Server）下运行。';
            });
    }

    function closeCodeModal(event) {
        if (event) event.stopPropagation();
        document.getElementById('codeModal').style.display = 'none';
    }

    // --- 使用教程弹窗控制 ---
    function openTutorialModal() {
        const modal = document.getElementById('tutorialModal');
        modal.style.display = 'flex';

        fetch('zi_yuan_wen_jian_jia/app使用教程.md')
            .then(response => {
                if (!response.ok) throw new Error('网络响应异常');
                return response.arrayBuffer();
            })
            .then(buffer => {
                const decoder = new TextDecoder('utf-8');
                const mdText = decoder.decode(buffer);
                // 使用 marked 渲染 Markdown 为 HTML
                document.getElementById('markdownBody').innerHTML = marked.parse(mdText);
            })
            .catch(err => {
                document.getElementById('markdownBody').innerHTML = '<p style="color:#ff6b6b;">⚠️ 读取教程失败，请检查 app使用教程.md 文件路径或确保在 Web 服务（如 Live Server）下运行。</p>';
            });
    }

    function closeTutorialModal(event) {
        if (event) event.stopPropagation();
        document.getElementById('tutorialModal').style.display = 'none';
    }
</script>
</body>
</html>
